<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공시 정보 - DART 전자공시 | 주식인포</title>
<meta name="description" content="금융감독원 DART 전자공시 정보. 사업보고서, 분기보고서, 주요사항보고서 등 최신 공시를 빠르게 확인하세요.">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9578749307688434" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0e1a; --bg2:#0f1629; --bg3:#151d35; --card:#111827;
    --border:#1e2d4a; --accent:#00d4aa; --accent2:#0ea5e9;
    --up:#22c55e; --down:#ef4444;
    --text:#e2e8f0; --text2:#94a3b8; --text3:#64748b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; font-size:14px; line-height:1.6; }

  nav { background:var(--bg2); border-bottom:1px solid var(--border); padding:0 24px; display:flex; align-items:center; height:56px; gap:24px; position:sticky; top:0; z-index:100; }
  .logo { font-size:18px; font-weight:700; color:var(--accent); letter-spacing:-0.5px; text-decoration:none; }
  .logo span { color:var(--text); }
  .nav-links { display:flex; gap:16px; }
  nav a { color:var(--text2); text-decoration:none; font-size:13px; transition:color 0.2s; white-space:nowrap; }
  nav a:hover, nav a.active { color:var(--accent); }
  .nav-right { margin-left:auto; }
  .search-bar { background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:6px 14px; color:var(--text); font-size:13px; font-family:inherit; width:200px; outline:none; transition:border-color 0.2s; }
  .search-bar:focus { border-color:var(--accent); }

  .page-header { background:var(--bg2); border-bottom:1px solid var(--border); padding:32px 24px; }
  .page-header-inner { max-width:1100px; margin:0 auto; }
  .page-header h1 { font-size:26px; font-weight:700; margin-bottom:8px; }
  .page-header h1 em { color:var(--accent); font-style:normal; }
  .page-header p { color:var(--text2); font-size:14px; }

  .main { max-width:1100px; margin:0 auto; padding:28px 24px; display:grid; grid-template-columns:1fr 300px; gap:24px; }
  @media(max-width:800px) { .main { grid-template-columns:1fr; } }

  .filters { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
  .filter-select { background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:8px 14px; color:var(--text); font-size:13px; font-family:inherit; outline:none; cursor:pointer; }
  .filter-select:focus { border-color:var(--accent); }
  .dart-search { background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:8px 14px; color:var(--text); font-size:13px; font-family:inherit; outline:none; flex:1; min-width:160px; }
  .dart-search:focus { border-color:var(--accent); }
  .dart-search::placeholder { color:var(--text3); }

  .section-title { font-size:15px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .section-title::before { content:''; width:3px; height:16px; background:var(--accent); border-radius:2px; display:block; }
  .badge { background:var(--accent); color:var(--bg); font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; }

  .dart-list { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .dart-item { padding:16px 18px; border-bottom:1px solid var(--border); transition:background 0.15s; cursor:pointer; display:flex; gap:14px; align-items:flex-start; }
  .dart-item:last-child { border-bottom:none; }
  .dart-item:hover { background:var(--bg3); }
  .dart-badge { font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; white-space:nowrap; flex-shrink:0; margin-top:2px; }
  .badge-main { background:#7c3aed20; color:#a78bfa; border:1px solid #7c3aed40; }
  .badge-qrt { background:#0ea5e920; color:#38bdf8; border:1px solid #0ea5e940; }
  .badge-major { background:#ef444420; color:#f87171; border:1px solid #ef444440; }
  .badge-div { background:#00d4aa20; color:#00d4aa; border:1px solid #00d4aa40; }
  .badge-own { background:#f59e0b20; color:#fbbf24; border:1px solid #f59e0b40; }
  .badge-other { background:#64748b20; color:#94a3b8; border:1px solid #64748b40; }
  .dart-content { flex:1; min-width:0; }
  .dart-title { font-size:14px; font-weight:500; color:var(--text); margin-bottom:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dart-meta { display:flex; gap:12px; font-size:12px; color:var(--text3); flex-wrap:wrap; }
  .dart-company { color:var(--accent2); font-weight:500; }
  .dart-date { font-family:'IBM Plex Mono',monospace; }

  .sidebar { display:flex; flex-direction:column; gap:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; }
  .card-title { font-size:13px; font-weight:700; margin-bottom:14px; color:var(--text2); }
  .mini-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .mini-row:last-child { border-bottom:none; }

  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
  .stat-box { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center; }
  .stat-num { font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; color:var(--accent); }
  .stat-label { font-size:11px; color:var(--text3); margin-top:4px; }

  .pagination { display:flex; justify-content:center; gap:6px; margin-top:20px; flex-wrap:wrap; }
  .page-btn { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:6px 12px; color:var(--text2); font-size:13px; font-family:inherit; cursor:pointer; transition:all 0.2s; }
  .page-btn.active { background:var(--accent); border-color:var(--accent); color:var(--bg); }
  .page-btn:hover:not(.active) { border-color:var(--accent); color:var(--text); }

  footer { border-top:1px solid var(--border); padding:24px; text-align:center; color:var(--text3); font-size:12px; margin-top:48px; }

  @media(max-width:600px) {
    nav { padding:0 16px; gap:12px; }
    .nav-links { display:none; }
    .page-header h1 { font-size:20px; }
    .main { padding:20px 16px; }
    .dart-title { white-space:normal; }
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">주식<span>인포</span></a>
  <div class="nav-links">
    <a href="/stocks.html">국내주식</a>
    <a href="/etf.html">ETF</a>
    <a href="/news.html">뉴스</a>
    <a href="/dart.html" class="active">공시</a>
    <a href="/heatmap.html">히트맵</a>
    <a href="/ipo.html">IPO</a>
    <a href="/calendar.html">경제캘린더</a>
  </div>
  <div class="nav-right">
    <input class="search-bar" type="text" placeholder="종목 검색..." id="searchInput">
  </div>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <h1><em>공시 정보</em> — DART 전자공시</h1>
    <p>금융감독원 전자공시시스템(DART) 최신 공시를 실시간으로 확인하세요</p>
  </div>
</div>

<div class="main">
  <div class="content">
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num" id="todayCount">47</div><div class="stat-label">오늘 공시</div></div>
      <div class="stat-box"><div class="stat-num" id="majorCount">8</div><div class="stat-label">주요사항</div></div>
      <div class="stat-box"><div class="stat-num" id="weekCount">312</div><div class="stat-label">주간 공시</div></div>
      <div class="stat-box"><div class="stat-num" id="companyCount">186</div><div class="stat-label">공시 기업</div></div>
    </div>

    <div class="filters">
      <select class="filter-select" id="filterType" onchange="renderDart()">
        <option value="all">전체 공시</option>
        <option value="A">사업보고서</option>
        <option value="B">분기/반기보고서</option>
        <option value="C">주요사항보고서</option>
        <option value="D">배당공시</option>
        <option value="E">자기주식</option>
      </select>
      <select class="filter-select" id="filterMarket" onchange="renderDart()">
        <option value="all">전체 시장</option>
        <option value="KOSPI">KOSPI</option>
        <option value="KOSDAQ">KOSDAQ</option>
        <option value="KONEX">KONEX</option>
      </select>
      <input class="dart-search" type="text" id="dartSearch" placeholder="종목명 또는 공시 내용 검색..." oninput="renderDart()">
    </div>

    <div class="section-title">최신 공시 <span class="badge">LIVE</span></div>
    <div class="dart-list" id="dartList"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div class="sidebar">
    <div class="card">
      <div class="card-title">🔥 많이 본 공시</div>
      <div id="hotDart"></div>
    </div>
    <div class="card">
      <div class="card-title">📋 공시 유형별 현황</div>
      <div id="typeStats"></div>
    </div>
    <div class="card">
      <div class="card-title">🔔 공시 빈도 상위 기업</div>
      <div id="topCompany"></div>
    </div>
  </div>
</div>

<footer>
  <p>주식인포 · 공시 데이터 출처: 금융감독원 전자공시시스템(DART)</p>
  <p style="margin-top:6px">본 사이트의 정보는 투자 참고용이며 투자 결정의 책임은 본인에게 있습니다.</p>
</footer>

<script>
const dartData = [
  { id:1, type:'A', typeName:'사업보고서', company:'삼성전자', code:'005930', market:'KOSPI', title:'사업보고서 (2024.12)', date:'2025-03-14 16:42', hot:true },
  { id:2, type:'C', typeName:'주요사항', company:'SK하이닉스', code:'000660', market:'KOSPI', title:'유상증자 결정 (제3자배정)', date:'2025-05-06 09:12', hot:true },
  { id:3, type:'D', typeName:'배당공시', company:'현대차', code:'005380', market:'KOSPI', title:'현금·현물배당결정 (보통주 1주당 2,000원)', date:'2025-05-06 08:55' },
  { id:4, type:'B', typeName:'분기보고서', company:'LG에너지솔루션', code:'373220', market:'KOSPI', title:'분기보고서 (2025.03)', date:'2025-05-06 08:30' },
  { id:5, type:'C', typeName:'주요사항', company:'카카오', code:'035720', market:'KOSPI', title:'단일판매·공급계약체결 (공급계약 약 1,200억)', date:'2025-05-05 18:10' },
  { id:6, type:'E', typeName:'자기주식', company:'NAVER', code:'035420', market:'KOSPI', title:'자기주식취득 결정 (500억 규모)', date:'2025-05-05 17:40' },
  { id:7, type:'A', typeName:'사업보고서', company:'셀트리온', code:'068270', market:'KOSPI', title:'사업보고서 (2024.12)', date:'2025-05-05 15:22' },
  { id:8, type:'C', typeName:'주요사항', company:'에코프로비엠', code:'247540', market:'KOSDAQ', title:'최대주주 변경을 수반하는 주식담보 제공', date:'2025-05-05 14:50' },
  { id:9, type:'D', typeName:'배당공시', company:'KT&G', code:'033780', market:'KOSPI', title:'현금배당결정 (주당 1,200원)', date:'2025-05-05 14:20' },
  { id:10, type:'B', typeName:'분기보고서', company:'삼성바이오로직스', code:'207940', market:'KOSPI', title:'분기보고서 (2025.03)', date:'2025-05-05 13:55' },
  { id:11, type:'C', typeName:'주요사항', company:'포스코홀딩스', code:'005490', market:'KOSPI', title:'해외법인 설립 결정 (캐나다 법인)', date:'2025-05-05 11:30' },
  { id:12, type:'E', typeName:'자기주식', company:'기아', code:'000270', market:'KOSPI', title:'자기주식 소각 결정 (200만주)', date:'2025-05-05 10:12' },
  { id:13, type:'A', typeName:'사업보고서', company:'크래프톤', code:'259960', market:'KOSPI', title:'사업보고서 (2024.12)', date:'2025-05-04 16:40' },
  { id:14, type:'C', typeName:'주요사항', company:'HLB', code:'028300', market:'KOSDAQ', title:'FDA 신약 허가 결과 공시', date:'2025-05-04 08:02', hot:true },
  { id:15, type:'D', typeName:'배당공시', company:'신한지주', code:'055550', market:'KOSPI', title:'분기배당 결정 (주당 540원)', date:'2025-05-03 17:00' },
];

const typeMap = { A:'badge-main', B:'badge-qrt', C:'badge-major', D:'badge-div', E:'badge-own' };
let currentPage = 1;
const perPage = 8;

function getFiltered() {
  const type = document.getElementById('filterType').value;
  const market = document.getElementById('filterMarket').value;
  const q = document.getElementById('dartSearch').value.toLowerCase();
  return dartData.filter(d => {
    if(type !== 'all' && d.type !== type) return false;
    if(market !== 'all' && d.market !== market) return false;
    if(q && !d.company.toLowerCase().includes(q) && !d.title.toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderDart() {
  currentPage = 1;
  renderPage();
}

function renderPage() {
  const filtered = getFiltered();
  const total = filtered.length;
  const totalPages = Math.ceil(total / perPage);
  const items = filtered.slice((currentPage-1)*perPage, currentPage*perPage);

  document.getElementById('dartList').innerHTML = items.length ? items.map(d => `
    <div class="dart-item" onclick="window.open('https://dart.fss.or.kr','_blank')">
      <span class="dart-badge ${typeMap[d.type]||'badge-other'}">${d.typeName}</span>
      <div class="dart-content">
        <div class="dart-title">${d.title}</div>
        <div class="dart-meta">
          <span class="dart-company">${d.company}</span>
          <span>${d.code}</span>
          <span>${d.market}</span>
          <span class="dart-date">${d.date}</span>
        </div>
      </div>
    </div>`).join('') : '<div style="text-align:center;padding:40px;color:var(--text3)">검색 결과가 없습니다.</div>';

  const pg = document.getElementById('pagination');
  pg.innerHTML = '';
  for(let i=1; i<=totalPages; i++) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (i===currentPage?' active':'');
    btn.textContent = i;
    btn.onclick = () => { currentPage = i; renderPage(); };
    pg.appendChild(btn);
  }
}

function renderSidebar() {
  const hot = dartData.filter(d => d.hot);
  document.getElementById('hotDart').innerHTML = hot.map(d => `
    <div class="mini-row" style="flex-direction:column;align-items:flex-start;gap:4px;cursor:pointer" onclick="window.open('https://dart.fss.or.kr','_blank')">
      <div style="font-size:12px;color:var(--accent2);font-weight:500">${d.company}</div>
      <div style="font-size:12px;color:var(--text2);line-height:1.4">${d.title.substring(0,30)}...</div>
    </div>`).join('');

  const typeCounts = { A:0, B:0, C:0, D:0, E:0 };
  const typeNames = { A:'사업보고서', B:'분기/반기', C:'주요사항', D:'배당공시', E:'자기주식' };
  dartData.forEach(d => { if(typeCounts[d.type]!==undefined) typeCounts[d.type]++; });
  document.getElementById('typeStats').innerHTML = Object.entries(typeCounts).map(([k,v]) => `
    <div class="mini-row">
      <span style="font-size:13px">${typeNames[k]}</span>
      <span style="font-family:'IBM Plex Mono',monospace;color:var(--accent)">${v}</span>
    </div>`).join('');

  const companies = {};
  dartData.forEach(d => { companies[d.company] = (companies[d.company]||0)+1; });
  const sorted = Object.entries(companies).sort((a,b)=>b[1]-a[1]).slice(0,5);
  document.getElementById('topCompany').innerHTML = sorted.map(([name,cnt]) => `
    <div class="mini-row">
      <span style="color:var(--accent2)">${name}</span>
      <span style="font-family:'IBM Plex Mono',monospace;color:var(--text3)">${cnt}건</span>
    </div>`).join('');
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') { const q = e.target.value.trim(); if(q) location.href = '/stocks.html?q=' + encodeURIComponent(q); }
});

renderDart();
renderSidebar();
</script>
</body>
</html>
