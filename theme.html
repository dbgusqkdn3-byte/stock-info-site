  .hero h1 em{color:var(--accent);font-style:normal;}
  .hero p{color:var(--text2);}

  .main{max-width:1100px;margin:0 auto;padding:32px 24px;}

  .theme-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;}
  .theme-tab{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:8px 18px;font-size:13px;cursor:pointer;transition:all 0.2s;color:var(--text2);}
  .theme-tab:hover,.theme-tab.active{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700;}

  .theme-section{margin-bottom:32px;}
  .theme-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:12px 0 10px;border-bottom:1px solid var(--border);}

  .theme-title{font-size:15px;font-weight:700;}
  .theme-desc{font-size:13px;color:var(--text3);margin-left:auto;}

  .stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .stock-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all 0.2s;text-decoration:none;display:block;}
  .stock-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .stock-card .name{font-size:14px;font-weight:700;margin-bottom:4px;}
  .stock-card .code{font-size:11px;color:var(--text3);font-family:'IBM Plex Mono',monospace;margin-bottom:10px;}
  .stock-card .price{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500;}
  .stock-card .change{font-size:12px;margin-top:4px;font-family:'IBM Plex Mono',monospace;}
  .stock-card .reason{font-size:11px;color:var(--text3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.5;}
  .up{color:var(--up);} .down{color:var(--down);}

  .hot-badge{background:var(--down);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:6px;}
  .new-badge{background:var(--accent);color:var(--bg);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:6px;}

  footer{border-top:1px solid var(--border);padding:24px;text-align:center;color:var(--text3);font-size:12px;margin-top:48px;}

let currentTheme = 'all';

function filterTheme(id) {
  currentTheme = id;
  document.querySelectorAll('.theme-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function fmt(n){return n.toLocaleString('ko-KR');}

function render() {
  const filtered = currentTheme === 'all' ? themes : themes.filter(t => t.id === currentTheme);
  document.getElementById('themeContainer').innerHTML = filtered.map(theme => `
    <div class="theme-section" id="theme-${theme.id}">
      <div class="theme-header">
        <span class="theme-icon">${theme.icon}</span>
        <span class="theme-title">${theme.title}</span>
        <span class="theme-desc">${theme.desc}</span>
      </div>
      <div class="stock-grid">
        ${theme.stocks.map(s => `
          <a href="/stock.html?code=${s.code}&name=${encodeURIComponent(s.name)}" class="stock-card">
            <div class="name">${s.name}${s.hot?'<span class="hot-badge">HOT</span>':''}</div>
            <div class="code">${s.code}</div>
            <div class="price">${fmt(s.price)}원</div>
            <div class="change ${s.change>=0?'up':'down'}">${s.change>=0?'▲':'▼'} ${Math.abs(s.change).toFixed(2)}%</div>
            <div class="reason">${s.reason}</div>
          </a>`).join('')}
      </div>
    </div>`).join('');
}

render();
